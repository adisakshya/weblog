name: CI

on:
  pull_request:
  push:
    branches: [master, redesign/weblog-static]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the content-preservation test reads the baseline commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Bun (pinned)
        run: npm install --global bun@1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Content preservation (original Markdown, front matter, comments, images byte-identical)
        run: python3 tests/test_legacy_inventory.py
      - name: Static build (prerender + 404 + .nojekyll)
        run: bun run build
      - name: Route manifest (every legacy public route exists)
        run: node scripts/check-dist.mjs
      - name: Release gate self-test (live-check must fail on realistic faults)
        run: node --test tests/live-check.test.mjs
      - name: Sitemap and Atom feed
        run: python3 tests/test_feeds.py
      - name: Content fidelity (every legacy block/link/image/anchor/code block present unless explicitly exempt) + negative tests
        run: python3 scripts/check_content_fidelity.py && python3 tests/test_content_fidelity.py
      - run: bunx playwright install --with-deps chromium
      - name: Browser checks against the static artifact (routes, search, appearance + contrast, keyboard/a11y, overflow, views, article, links)
        run: node --test tests/e2e/*.test.mjs
      - name: Visual comparator self-tests (must fail on regressions; negative fixtures from all approved screenshots)
        run: node --test tests/visual-compare.test.mjs tests/visual-structural.test.mjs
      - name: Visual comparison with the approved reference (12 themes, 2 widths, search, appearance)
        run: node scripts/visual-check.mjs visual-out
        env:
          # The reference was captured on a different OS image/fonts than GitHub's runner (the first CI run measured 0.65-6.9%
          # differing pixels per shot with identical content), so CI compares 16x16 block averages instead of pixels:
          # noise-tolerant, but a blank page, erased section, wrong theme or shifted layout fails for every shot
          # (tests/visual-structural.test.mjs). The strict pixel run is `bun run visual` on the capturing environment.
          VISUAL_MODE: structural
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: visual-out/diff
          if-no-files-found: ignore
